name: Build APK

# Builds an installable release APK. Defaults to arm64, which is what a
# Galaxy S24 (and every other modern phone) runs.
on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      abi:
        description: Target ABI
        type: choice
        default: android-arm64
        options:
          - android-arm64
          - android-arm
          - android-arm,android-arm64,android-x64

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Pinned to the version this project is developed and tested against,
      # rather than tracking stable, so a Flutter release cannot break CI.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.3
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Without a keystore the release build falls back to the debug key, and
      # GitHub generates a fresh debug key per run — so those APKs cannot be
      # installed over each other. See the README for one-time setup.
      - name: Configure release signing
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning title=Unsigned build::No KEYSTORE_BASE64 secret set. \
          This APK is signed with a throwaway debug key and cannot be installed \
          over an existing install. See README > Building from CI."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/release-keystore.jks
          {
            printf 'storeFile=release-keystore.jks\n'
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n'      "$KEY_ALIAS"
            printf 'keyPassword=%s\n'   "$KEY_PASSWORD"
          } > android/key.properties
          echo "Release keystore configured."

      # The Android Gradle Plugin provisions the NDK on first run even though
      # this app has no native code, so a cold build takes several minutes.
      - name: Build release APK
        run: flutter build apk --release --target-platform ${{ github.event.inputs.abi || 'android-arm64' }}

      - name: Report APK details
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          ls -lh "$APK"
          echo "sha256: $(sha256sum "$APK" | cut -d' ' -f1)"
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK" \
            | grep -iE "signer #1 certificate (DN|SHA-256)" || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kuzum-reader-${{ github.run_number }}-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
